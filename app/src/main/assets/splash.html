<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<meta content="mobile_blank" name="shell-type">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100vw;
  height: 100%;
  min-height: 100vh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #00221a;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

/* Custom keyframes for splash sequence */
@keyframes bounceInMedallion {
  0% { opacity: 0; transform: scale(0.25) translateY(40px); }
  50% { opacity: 1; transform: scale(1.1) translateY(-8px); }
  70% { transform: scale(0.96) translateY(3px); }
  85% { transform: scale(1.02) translateY(-1px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes slideUpText {
  0% { opacity: 0; transform: translateY(30px); }
  60% { opacity: 0.85; }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes zoomDisappearTogether {
  0% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 15px rgba(254, 214, 91, 0.3)); }
  20% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 40px rgba(254, 214, 91, 0.8)); }
  100% { transform: scale(18); opacity: 0; filter: drop-shadow(0 0 100px rgba(255, 224, 139, 1)); }
}

@keyframes spinClockwise {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes spinCounterClockwise {
  from { transform: rotate(0deg); }
  to { transform: rotate(-360deg); }
}

@keyframes softPulse {
  0%, 100% { opacity: 0.45; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.08); }
}

.anim-bounce-in { animation: bounceInMedallion 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
.anim-text-enter { animation: slideUpText 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.anim-zoom-out-all { animation: zoomDisappearTogether 1.25s cubic-bezier(0.68, -0.05, 0.85, 0.05) forwards !important; pointer-events: none; }

/* Self-contained styling for instant offline load */
.screen-wrap {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: radial-gradient(ellipse at top, #0f382e 0%, #07241e 50%, #00221a 100%);
  overflow: hidden;
  cursor: pointer;
}

.bg-pattern {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  opacity: 0.048;
  pointer-events: none;
}

.splash-hero {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 480px;
  padding: 0 16px;
  transform-origin: center center;
  will-change: transform, opacity, filter;
}

.medallion-container {
  position: relative;
  width: 250px;
  height: 250px;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform;
}

.glow-aura {
  position: absolute;
  top: -24px; left: -24px; right: -24px; bottom: -24px;
  border-radius: 9999px;
  background: radial-gradient(circle, rgba(254, 214, 91, 0.28) 0%, rgba(201, 167, 65, 0.15) 50%, transparent 75%);
  filter: blur(24px);
  animation: softPulse 3.5s ease-in-out infinite;
}

.orbit-ring-1 {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 9999px;
  border: 1px solid rgba(254, 214, 91, 0.28);
  animation: spinClockwise 24s linear infinite;
}

.orbit-dot-top {
  position: absolute;
  top: -4px; left: 50%;
  transform: translateX(-50%);
  width: 8px; height: 8px;
  border-radius: 9999px;
  background-color: #ffe088;
  box-shadow: 0 0 10px #fed65b, 0 0 16px #fed65b;
}

.orbit-dot-bottom {
  position: absolute;
  bottom: -4px; left: 50%;
  transform: translateX(-50%);
  width: 8px; height: 8px;
  border-radius: 9999px;
  background-color: #ffe088;
  box-shadow: 0 0 10px #fed65b, 0 0 16px #fed65b;
}

.orbit-ring-2 {
  position: absolute;
  top: 12px; left: 12px; right: 12px; bottom: 12px;
  border-radius: 9999px;
  border: 1.5px dashed rgba(254, 214, 91, 0.38);
  animation: spinCounterClockwise 36s linear infinite;
}

.medallion-disc {
  position: absolute;
  top: 24px; left: 24px; right: 24px; bottom: 24px;
  border-radius: 9999px;
  background: #0e483c;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), inset 0 0 20px rgba(254, 214, 91, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  border: 1.5px solid rgba(255, 224, 136, 0.45);
}

.medallion-inner {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 9999px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #0e483c;
}

.medallion-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.title-container {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 360px;
  will-change: transform, opacity;
}

.svg-title-wrapper {
  width: 100%;
  max-width: 340px;
  display: flex;
  justify-content: center;
  filter: drop-shadow(0 0 18px rgba(255, 224, 139, 0.45));
}
</style>
</head>

    function notifyAndroid() {
      if (finishTriggered) return;
      finishTriggered = true;
      if (window.AndroidSplash && window.AndroidSplash.onSplashFinished) {
        window.AndroidSplash.onSplashFinished();
      }
    }

    function startSequence() {
      if (zoomTimeout) clearTimeout(zoomTimeout);

      splashHero.classList.remove('anim-zoom-out-all');
      medallion.classList.remove('anim-bounce-in');
      titleText.classList.remove('anim-text-enter');

      void splashHero.offsetWidth;

      medallion.classList.add('anim-bounce-in');
      titleText.classList.add('anim-text-enter');

      // Zoom out after 3.2 seconds
      zoomTimeout = setTimeout(() => {
        splashHero.classList.add('anim-zoom-out-all');
        // Transition to main app once zoom out dissolves
        setTimeout(notifyAndroid, 1050);
      }, 3200);
    }

    startSequence();

    // Fast tap to skip
    screenContainer.addEventListener('click', () => {
      splashHero.classList.add('anim-zoom-out-all');
      setTimeout(notifyAndroid, 500);
    });
  })();
</script>
</main>
</body>
</html>
